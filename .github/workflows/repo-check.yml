name: repo-check

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'schema/**'
      - 'tools/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'DEVELOPMENT.md'
      - 'CHANGELOG.md'
      - 'requirements.txt'
      - '.github/**'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Invariants (knowledge)
        run: python tools/repo-kit/check_repo.py --root . --baseline schema/check-baseline.json
      - name: Generated artifacts up to date
        run: python tools/repo-kit/generate.py --root . --check
      - name: Kit lock
        run: pwsh tools/update-repo-kit.ps1 -Check
